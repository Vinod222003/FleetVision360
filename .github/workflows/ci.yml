name: FleetVision 360 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg2-binary python-dotenv fastapi uvicorn joblib numpy scikit-learn

      - name: Check FastAPI syntax
        run: |
          python -m py_compile backend/main.py

      - name: Check data quality test syntax
        run: |
          python -m py_compile tests/test_data_quality.py

      - name: Verify test collection
        run: |
          pytest tests/test_data_quality.py --collect-only -q
